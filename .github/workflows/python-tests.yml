name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Abhängigkeiten installieren
      run: pip install -e .

    - name: Tests ausführen
      run: pytest -v